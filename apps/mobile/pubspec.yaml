name: sbexpress
description: SBExpress Flutter app for Admin and Hub Manager.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  pdfrx: ^2.9.0
  share_plus: ^13.3.1
  image: ^4.5.4
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.17.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
